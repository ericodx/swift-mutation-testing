# Project identification
sonar.projectKey=ericodx-swift-mutation-testing
sonar.projectName=Swift Mutation Testing
sonar.projectDescription=Measure and improve test effectiveness in Swift codebases using mutation testing.
sonar.organization=ericodx

# Source code
sonar.sources=Sources

# Exclusions
sonar.exclusions=Tests/**/*,**/*Tests.swift,**/TestSupport/**/*

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage
sonar.coverageReportPaths=coverage/code-coverage-report.xml

# Ignored rules
sonar.issue.ignore.multicriteria=e1,e2

# S1075: hardcoded URIs
sonar.issue.ignore.multicriteria.e1.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# S1186: empty methods, whose exemption is an explanatory comment this project does not use
sonar.issue.ignore.multicriteria.e2.ruleKey=swift:S1186
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
